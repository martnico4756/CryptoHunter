name: CryptoHunter automatico

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  revisar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar CryptoHunter
        run: python cryptohunter.py
